name: Build BLOODRUSH APK

on:
  push:
    branches: [ccr-25b70f26-n3nnza]
    paths: ['bloodrush-android/**', '.github/workflows/bloodrush-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: bloodrush-android
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp bloodrush-android/app/build/outputs/apk/debug/app-debug.apk BLOODRUSH.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BLOODRUSH-apk
          path: BLOODRUSH.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bloodrush-latest
          name: BLOODRUSH (latest APK)
          files: BLOODRUSH.apk
          target_commitish: ${{ github.sha }}
